<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halloween at Coasters Tavern - PRO CANVAS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000;
        }

        .bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('coasters_halloween.jpg?v=5');
            background-size: cover;
            background-position: center;
            z-index: 1;
            animation: breathe 30s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 1920px; height: 1080px;
            z-index: 5;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.95) 100%);
            z-index: 6;
            pointer-events: none;
        }

        .content {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-family: 'Cinzel', serif;
        }

        h1 {
            font-size: 100px;
            letter-spacing: 10px;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 50px rgba(255,100,0,0.8), 0 5px 15px #000;
            white-space: nowrap;
        }
        
        h1 span {
            transition: opacity 0.1s ease-in;
            opacity: 0;
            display: inline-block;
            margin: 0 15px;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>

    <div class="content">
        <h1>
            <span id="word0">JOIN</span>
            <span id="word1">US</span>
            <span id="word2">FOR</span>
            <span id="word3">HALLOWEEN</span>
        </h1>
    </div>

    <script>
        const canvas = document.getElementById('fx');
        const ctx = canvas.getContext('2d');
        canvas.width = 1920;
        canvas.height = 1080;

        let time = 0;

        // Foreground Bats
        const bats = Array.from({length: 8}, () => ({
            x: Math.random() * 1920,
            y: Math.random() * 400 + 50,
            speed: Math.random() * 3 + 3,
            scale: Math.random() * 0.4 + 0.3,
            phase: Math.random() * Math.PI * 2
        }));

        // Distant Bats crossing the moon
        const distantBats = Array.from({length: 15}, () => ({
            x: Math.random() * 1920,
            y: Math.random() * 200 + 100, // around the moon
            speed: Math.random() * 1.5 + 1.5,
            scale: Math.random() * 0.15 + 0.05,
            phase: Math.random() * Math.PI * 2
        }));
        
        const allBats = [...bats, ...distantBats];

        // Witch Image Loading
        const witchImg = new Image();
        witchImg.src = 'witch.png';
        
        let witch = {
            x: -200, y: 300,
            speed: 2.0, scale: 0.6
        };

        // Fog particles
        const fogs = Array.from({length: 20}, () => ({
            x: Math.random() * 1920,
            y: 800 + Math.random() * 300,
            radius: 200 + Math.random() * 300,
            speed: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.2 + 0.1
        }));

        // Owls in the trees
        const owls = [
            {x: 180, y: 420, timer: Math.random() * 100},
            {x: 320, y: 350, timer: Math.random() * 100},
            {x: 1650, y: 480, timer: Math.random() * 100},
            {x: 1800, y: 390, timer: Math.random() * 100}
        ];

        // Lightning state
        let lightning = 0;
        let lightningPath = [];
        let revealedWords = 0;
        const totalWords = 4;

        function generateLightning() {
            lightningPath = [];
            let startX = Math.random() * 1920;
            let targetX = 960 + (Math.random() - 0.5) * 600; // Strike towards foreground text area
            
            let cx = startX;
            let cy = 0;
            lightningPath.push({x: cx, y: cy});
            
            while(cy < 1080) {
                cx += (Math.random() - 0.5) * 200 + (targetX - cx) * 0.15; // Pull towards target
                cy += Math.random() * 80 + 50;
                lightningPath.push({x: cx, y: cy});
            }
            lightning = 1.0;

            // Reveal word on strike
            if (revealedWords < totalWords) {
                document.getElementById('word' + revealedWords).style.opacity = 1;
                revealedWords++;
            }
        }

        // Sequential strikes to reveal message, then random
        setTimeout(() => {
            let strikeInterval = setInterval(() => {
                generateLightning();
                if (revealedWords >= totalWords) {
                    clearInterval(strikeInterval);
                    setInterval(() => {
                        if (Math.random() > 0.4) generateLightning();
                    }, 8000);
                }
            }, 1200); // Fast sequence to read word by word
        }, 1000);

        function drawBat(ctx, x, y, scale, wingAngle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#050505';
            
            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Sharp Pointy Wings
            ctx.save();
            ctx.scale(1, Math.cos(wingAngle));
            
            // Left wing
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.quadraticCurveTo(-40, -40, -120, -40); // Sharp tip
            ctx.quadraticCurveTo(-80, -10, -100, 10);
            ctx.quadraticCurveTo(-60, -5, -40, 20);
            ctx.quadraticCurveTo(-20, 0, 0, 10);
            ctx.fill();
            
            // Right wing
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.quadraticCurveTo(40, -40, 120, -40);
            ctx.quadraticCurveTo(80, -10, 100, 10);
            ctx.quadraticCurveTo(60, -5, 40, 20);
            ctx.quadraticCurveTo(20, 0, 0, 10);
            ctx.fill();
            
            ctx.restore();
            ctx.restore();
        }

        function drawWitch(ctx, x, y, scale, angle) {
            if (!witchImg.complete || witchImg.width === 0) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.rotate(angle);
            ctx.drawImage(witchImg, -witchImg.width / 2, -witchImg.height / 2);
            ctx.restore();
        }

        function drawFog(ctx) {
            ctx.globalCompositeOperation = 'screen';
            fogs.forEach(f => {
                f.x -= f.speed;
                if(f.x + f.radius < 0) f.x = 1920 + f.radius;

                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, `rgba(150, 150, 180, ${f.opacity})`);
                grad.addColorStop(1, 'rgba(150, 150, 180, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawOwls(ctx) {
            owls.forEach(owl => {
                owl.timer += 0.5;
                let eyeScale = 1;
                // Blink closed randomly
                if (owl.timer > 100) {
                    if (owl.timer < 105) eyeScale = 0.1;
                    else owl.timer = 0;
                }
                
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.ellipse(owl.x, owl.y, 3, 4 * eyeScale, 0, 0, Math.PI*2);
                ctx.ellipse(owl.x + 16, owl.y, 3, 4 * eyeScale, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            time += 0.05;

            // Draw Moon
            const mx = 350, my = 200;
            const moonGlow = ctx.createRadialGradient(mx, my, 20, mx, my, 400);
            moonGlow.addColorStop(0, 'rgba(255, 255, 200, 1)');
            moonGlow.addColorStop(0.2, 'rgba(255, 150, 50, 0.5)');
            moonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(mx, my, 400, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Draw Distant and Foreground Bats
            allBats.forEach(b => {
                b.x -= b.speed;
                b.y += Math.sin(time + b.phase) * 1.5;
                if (b.x < -150) b.x = 2100;
                const wingAngle = time * 6 + b.phase;
                drawBat(ctx, b.x, b.y, b.scale, wingAngle);
            });

            // Draw Fog
            drawFog(ctx);
            
            // Draw Owls
            drawOwls(ctx);

            // Draw Lightning
            if (lightning > 0) {
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = `rgba(255, 255, 255, ${lightning * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = `rgba(255, 255, 255, ${lightning})`;
                ctx.lineWidth = 6;
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 40;
                
                ctx.beginPath();
                ctx.moveTo(lightningPath[0].x, lightningPath[0].y);
                for(let i=1; i<lightningPath.length; i++) {
                    ctx.lineTo(lightningPath[i].x, lightningPath[i].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
                lightning -= 0.05;
                ctx.globalCompositeOperation = 'source-over';
            }

            // Draw Witch (Smooth Randomized Flight)
            witch.x -= witch.speed;
            if (Math.random() < 0.01) witch.targetY = Math.random() * 300 + 50;
            if (witch.targetY === undefined) witch.targetY = 300;
            witch.y += (witch.targetY - witch.y) * 0.015;
            let flightAngle = (witch.y - witch.targetY) * 0.005;

            if (witch.x < -300) {
                witch.x = 2100;
                witch.y = Math.random() * 300 + 100;
                witch.targetY = witch.y;
            }
            drawWitch(ctx, witch.x, witch.y, witch.scale, flightAngle);

            requestAnimationFrame(render);
        }

        render();

        // Keyboard controls
        let isPaused = false;
        let isLocked = false;
        let slideDuration = 10;
        let slideTimer = null;

        function prevSlide() { if(!isLocked) console.log("Previous slide"); }
        function nextSlide() { if(!isLocked) console.log("Next slide"); }
        function restartModule() { if(!isLocked) console.log("Restart module (slide 0)"); }
        function skipModule() { if(!isLocked) console.log("Skip module"); }
        
        function resetTimer() {
            if(slideTimer) clearInterval(slideTimer);
            if(!isPaused && !isLocked) {
                slideTimer = setInterval(nextSlide, slideDuration * 1000);
            }
        }

        document.addEventListener('keydown', function(event) {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (['input', 'textarea', 'select'].includes(activeTag)) return;

            switch(event.key) {
                case 'ArrowLeft': prevSlide(); break;
                case 'ArrowRight': nextSlide(); break;
                case 'ArrowUp': restartModule(); break;
                case 'ArrowDown': skipModule(); break;
                case ' ':
                case 'Spacebar':
                    isPaused = !isPaused;
                    resetTimer();
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                    window.open('admin.html', '_blank');
                    break;
                case 'r':
                case 'R':
                    window.open('remote.html', '_blank');
                    break;
                case '0':
                    isLocked = !isLocked;
                    resetTimer();
                    break;
                default:
                    const num = parseInt(event.key);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        slideDuration = num * 10;
                        resetTimer();
                    }
                    break;
            }
        });
        
        resetTimer();
    </script>
</body>
</html>
