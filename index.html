<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halloween at Coasters Tavern - Professional</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #050505;
            color: #fff;
        }

        /* Cinematic Background Image with Slow Zoom */
        .bg-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('coasters_halloween.jpg');
            background-size: cover;
            background-position: center;
            animation: ken-burns 40s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes ken-burns {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-1%, -1%); }
        }

        /* Atmospheric Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* Professional Lightning (Ambient Flash only, no jagged lines) */
        .lightning-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            opacity: 0;
            z-index: 4;
            pointer-events: none;
            animation: flash 15s infinite;
        }

        @keyframes flash {
            0%, 91%, 94%, 96%, 100% { opacity: 0; }
            92%, 95% { opacity: 0.15; }
            93% { opacity: 0.4; }
        }

        /* Subtle Fog/Clouds */
        .fog {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 40%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        .drifting-mist {
            position: absolute;
            top: 0; left: 0;
            width: 200%; height: 100%;
            background-image: radial-gradient(ellipse at center, rgba(200, 200, 255, 0.05) 0%, transparent 50%);
            background-size: 50% 100%;
            z-index: 3;
            animation: drift 40s linear infinite;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Elegant Typography */
        .content {
            position: absolute;
            bottom: 15%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            letter-spacing: 12px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 110px; /* Reduced to fit cleanly */
            letter-spacing: 6px;
            color: #f8f9fa;
            margin: 0;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(212, 175, 55, 0.4);
            white-space: nowrap;
        }

        /* Subtle Candle Glow on Pumpkins */
        .candle-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            animation: flicker 0.2s infinite alternate;
            mix-blend-mode: screen;
            z-index: 2;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        @keyframes flicker {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        
        /* Elegant Distant Bats (Silhouette only) */
        .bat-swarm {
            position: absolute;
            z-index: 2;
            opacity: 0.6;
            pointer-events: none;
            width: 50px;
            height: 50px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 40 Q55 20 85 10 Q70 35 95 35 Q75 55 85 75 Q65 60 50 85 Q35 60 15 75 Q25 55 5 35 Q30 35 15 10 Q45 20 50 40 Z" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            animation: swoop 15s linear infinite;
        }

        @keyframes swoop {
            0% { transform: translate(-100px, 300px) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(1000px, 100px) scale(0.8); }
            90% { opacity: 0.8; }
            100% { transform: translate(2100px, -50px) scale(1.2); opacity: 0; }
        }

        .bat1 { top: 20%; left: 0; animation-duration: 18s; animation-delay: 2s; }
        .bat2 { top: 15%; left: 0; animation-duration: 25s; animation-delay: 7s; transform: scale(0.6); }

        /* The Moon (Cinematic Soft Glow) */
        .moon-glow {
            position: absolute;
            top: 80px; 
            left: 200px;
            width: 150px; 
            height: 150px;
            background: radial-gradient(circle, rgba(255, 255, 220, 0.9) 0%, rgba(255, 200, 100, 0.2) 50%, transparent 100%);
            z-index: 1;
            pointer-events: none;
            animation: moon-pulse 6s infinite alternate;
        }

        @keyframes moon-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="moon-glow"></div>
    <div class="drifting-mist"></div>
    
    <div class="lightning-flash"></div>
    <div class="vignette"></div>
    <div class="fog"></div>

    <div class="candle-glow" style="top: 56.5%; left: 12%;"></div>
    <div class="candle-glow" style="top: 56.5%; left: 24%;"></div>
    <div class="candle-glow" style="top: 61%; left: 34.5%;"></div>
    <div class="candle-glow" style="top: 61%; left: 37.5%;"></div>
    <div class="candle-glow" style="top: 61%; left: 51%;"></div>
    <div class="candle-glow" style="top: 54%; left: 59%;"></div>
    <div class="candle-glow" style="top: 53.5%; left: 79%;"></div>

    <div class="bat-swarm bat1"></div>
    <div class="bat-swarm bat2"></div>

    <div class="content">
        <div class="subtitle">Coasters Tavern Presents</div>
        <h1>JOIN US FOR HALLOWEEN</h1>
    </div>

    <script>
        // Keyboard controls
        let isPaused = false;
        let isLocked = false;
        let slideDuration = 10;
        let slideTimer = null;

        function prevSlide() { if(!isLocked) console.log("Previous slide"); }
        function nextSlide() { if(!isLocked) console.log("Next slide"); }
        function restartModule() { if(!isLocked) console.log("Restart module (slide 0)"); }
        function skipModule() { if(!isLocked) console.log("Skip module"); }
        
        function resetTimer() {
            if(slideTimer) clearInterval(slideTimer);
            if(!isPaused && !isLocked) {
                slideTimer = setInterval(nextSlide, slideDuration * 1000);
            }
        }

        document.addEventListener('keydown', function(event) {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (['input', 'textarea', 'select'].includes(activeTag)) return;

            switch(event.key) {
                case 'ArrowLeft': prevSlide(); break;
                case 'ArrowRight': nextSlide(); break;
                case 'ArrowUp': restartModule(); break;
                case 'ArrowDown': skipModule(); break;
                case ' ':
                case 'Spacebar':
                    isPaused = !isPaused;
                    resetTimer();
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                    window.open('admin.html', '_blank');
                    break;
                case 'r':
                case 'R':
                    window.open('remote.html', '_blank');
                    break;
                case '0':
                    isLocked = !isLocked;
                    resetTimer();
                    break;
                default:
                    const num = parseInt(event.key);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        slideDuration = num * 10;
                        resetTimer();
                    }
                    break;
            }
        });
        
        resetTimer();
    </script>
</body>
</html>
