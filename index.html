<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halloween at Coasters Tavern</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Ken Burns Background */
        .bg-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('coasters_halloween.jpg');
            background-size: cover;
            background-position: center;
            animation: ken-burns 40s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes ken-burns {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-1%, -1%); }
        }

        /* Atmospheric Vignette and Darkness */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Subtle Fog/Mist Overlay */
        .fog {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 30%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Lightning Flashes */
        .lightning {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            opacity: 0;
            z-index: 4;
            pointer-events: none;
            animation: lightning-strike 20s infinite;
        }

        @keyframes lightning-strike {
            0%, 91%, 94%, 96%, 100% { opacity: 0; }
            92%, 95% { opacity: 0.15; }
            93% { opacity: 0.3; }
        }

        /* Gentle Ambient Flicker */
        .ambient-flicker {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 5;
            animation: ambient 6s infinite alternate;
            pointer-events: none;
        }

        @keyframes ambient {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        /* Professional Typography Container */
        .content {
            position: absolute;
            bottom: 15%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            animation: elegant-fade 3s ease-out forwards;
        }

        @keyframes elegant-fade {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            letter-spacing: 12px;
            color: #d4af37; /* Elegant gold */
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 130px;
            letter-spacing: 5px;
            color: #f8f9fa;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }

        /* Minimalist Clock */
        .clock-container {
            position: absolute;
            bottom: 40px;
            right: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 36px;
            color: #fff;
            letter-spacing: 3px;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            opacity: 0.8;
        }

        .colon {
            animation: blink 2s step-start infinite;
            display: inline-block;
            transform: translateY(-2px);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="vignette"></div>
    <div class="fog"></div>
    <div class="ambient-flicker"></div>
    <div class="lightning"></div>
    
    <div class="content">
        <div class="subtitle">Coasters Tavern Presents</div>
        <h1>JOIN US FOR HALLOWEEN</h1>
    </div>

    <div class="clock-container" id="clock">
        <span id="hour">12</span><span class="colon">:</span><span id="minute">00</span><span class="colon">:</span><span id="second">00</span>
    </div>

    <script>
        // Clock with blinking colon
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            let s = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('hour').textContent = h;
            document.getElementById('minute').textContent = m;
            document.getElementById('second').textContent = s;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Keyboard controls
        let isPaused = false;
        let isLocked = false;
        let slideDuration = 10;
        let slideTimer = null;

        function prevSlide() { if(!isLocked) console.log("Previous slide"); }
        function nextSlide() { if(!isLocked) console.log("Next slide"); }
        function restartModule() { if(!isLocked) console.log("Restart module (slide 0)"); }
        function skipModule() { if(!isLocked) console.log("Skip module"); }
        
        function resetTimer() {
            if(slideTimer) clearInterval(slideTimer);
            if(!isPaused && !isLocked) {
                slideTimer = setInterval(nextSlide, slideDuration * 1000);
            }
        }

        document.addEventListener('keydown', function(event) {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (['input', 'textarea', 'select'].includes(activeTag)) return;

            switch(event.key) {
                case 'ArrowLeft': prevSlide(); break;
                case 'ArrowRight': nextSlide(); break;
                case 'ArrowUp': restartModule(); break;
                case 'ArrowDown': skipModule(); break;
                case ' ':
                case 'Spacebar':
                    isPaused = !isPaused;
                    resetTimer();
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                    window.open('admin.html', '_blank');
                    break;
                case 'r':
                case 'R':
                    window.open('remote.html', '_blank');
                    break;
                case '0':
                    isLocked = !isLocked;
                    resetTimer();
                    break;
                default:
                    const num = parseInt(event.key);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        slideDuration = num * 10;
                        resetTimer();
                    }
                    break;
            }
        });
        
        resetTimer();
    </script>
</body>
</html>
