<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halloween at Coasters Tavern - PRO CANVAS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000;
        }

        .bg {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background-image: url('coasters_halloween.jpg?v=4');
            background-size: cover;
            background-position: center;
            z-index: 1;
            animation: breathe 30s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 1920px; height: 1080px;
            z-index: 5;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.95) 100%);
            z-index: 6;
            pointer-events: none;
        }

        .content {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-family: 'Cinzel', serif;
        }

        .subtitle {
            font-size: 24px;
            letter-spacing: 15px;
            color: #d4af37;
            text-shadow: 0 0 20px #000;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 100px;
            letter-spacing: 10px;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 50px rgba(255,100,0,0.8), 0 5px 15px #000;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>

    <div class="content">
        <h1>JOIN US FOR HALLOWEEN</h1>
    </div>

    <script>
        const canvas = document.getElementById('fx');
        const ctx = canvas.getContext('2d');
        canvas.width = 1920;
        canvas.height = 1080;

        let time = 0;

        // Bats
        const bats = Array.from({length: 6}, () => ({
            x: Math.random() * 1920,
            y: Math.random() * 400 + 50,
            speed: Math.random() * 2 + 3,
            scale: Math.random() * 0.4 + 0.3,
            phase: Math.random() * Math.PI * 2
        }));

        // Witch
        let witch = {
            x: -200, y: 300,
            speed: 1.5, scale: 0.6
        };

        // Fog particles
        const fogs = Array.from({length: 20}, () => ({
            x: Math.random() * 1920,
            y: 800 + Math.random() * 300,
            radius: 200 + Math.random() * 300,
            speed: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.2 + 0.1
        }));

        // Lightning state
        let lightning = 0;
        let lightningPath = [];

        function generateLightning() {
            lightningPath = [];
            let x = Math.random() * 1920;
            let y = 0;
            lightningPath.push({x, y});
            while(y < 1080) {
                x += (Math.random() - 0.5) * 200;
                y += Math.random() * 100 + 50;
                lightningPath.push({x, y});
            }
            lightning = 1.0;
        }

        setInterval(() => {
            if (Math.random() > 0.4) generateLightning();
        }, 10000);

        function drawBat(ctx, x, y, scale, wingAngle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.scale(1, Math.cos(wingAngle));
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.quadraticCurveTo(-60, -50, -120, -20);
            ctx.quadraticCurveTo(-80, 20, -40, 10);
            ctx.quadraticCurveTo(-20, 30, 0, 10);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.quadraticCurveTo(60, -50, 120, -20);
            ctx.quadraticCurveTo(80, 20, 40, 10);
            ctx.quadraticCurveTo(20, 30, 0, 10);
            ctx.fill();
            ctx.restore();
            ctx.restore();
        }

        function drawWitch(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.rotate(Math.sin(time) * 0.1);
            ctx.fillStyle = '#020202';
            
            // Simple Witch Silhouette Path
            ctx.beginPath();
            ctx.moveTo(80, 60);
            ctx.lineTo(90, 65);
            ctx.lineTo(85, 75);
            ctx.lineTo(15, 80);
            ctx.lineTo(5, 70);
            ctx.lineTo(10, 65);
            ctx.lineTo(30, 68);
            ctx.lineTo(40, 40);
            ctx.bezierCurveTo(35, 30, 50, 10, 60, 15);
            ctx.bezierCurveTo(65, 20, 60, 35, 50, 45);
            ctx.lineTo(45, 67);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawFog(ctx) {
            ctx.globalCompositeOperation = 'screen';
            fogs.forEach(f => {
                f.x -= f.speed;
                if(f.x + f.radius < 0) f.x = 1920 + f.radius;

                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, `rgba(150, 150, 180, ${f.opacity})`);
                grad.addColorStop(1, 'rgba(150, 150, 180, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            time += 0.05;

            // Draw Moon
            const mx = 350, my = 200;
            const moonGlow = ctx.createRadialGradient(mx, my, 20, mx, my, 400);
            moonGlow.addColorStop(0, 'rgba(255, 255, 200, 1)');
            moonGlow.addColorStop(0.2, 'rgba(255, 150, 50, 0.5)');
            moonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(mx, my, 400, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Draw Fog
            drawFog(ctx);

            // Draw Lightning
            if (lightning > 0) {
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = `rgba(255, 255, 255, ${lightning * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = `rgba(255, 255, 255, ${lightning})`;
                ctx.lineWidth = 5;
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 30;
                
                ctx.beginPath();
                ctx.moveTo(lightningPath[0].x, lightningPath[0].y);
                for(let i=1; i<lightningPath.length; i++) {
                    ctx.lineTo(lightningPath[i].x, lightningPath[i].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
                lightning -= 0.05;
                ctx.globalCompositeOperation = 'source-over';
            }

            // Draw Bats
            bats.forEach(b => {
                b.x -= b.speed;
                b.y += Math.sin(time + b.phase) * 1.5;
                if (b.x < -150) b.x = 2100;
                const wingAngle = time * 6 + b.phase;
                drawBat(ctx, b.x, b.y, b.scale, wingAngle);
            });

            // Draw Witch
            witch.x -= witch.speed;
            witch.y += Math.cos(time * 0.5) * 0.5;
            if (witch.x < -200) {
                witch.x = 2100;
                witch.y = Math.random() * 300 + 100;
            }
            drawWitch(ctx, witch.x, witch.y, witch.scale);

            requestAnimationFrame(render);
        }

        render();

        // Keyboard controls
        let isPaused = false;
        let isLocked = false;
        let slideDuration = 10;
        let slideTimer = null;

        function prevSlide() { if(!isLocked) console.log("Previous slide"); }
        function nextSlide() { if(!isLocked) console.log("Next slide"); }
        function restartModule() { if(!isLocked) console.log("Restart module (slide 0)"); }
        function skipModule() { if(!isLocked) console.log("Skip module"); }
        
        function resetTimer() {
            if(slideTimer) clearInterval(slideTimer);
            if(!isPaused && !isLocked) {
                slideTimer = setInterval(nextSlide, slideDuration * 1000);
            }
        }

        document.addEventListener('keydown', function(event) {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (['input', 'textarea', 'select'].includes(activeTag)) return;

            switch(event.key) {
                case 'ArrowLeft': prevSlide(); break;
                case 'ArrowRight': nextSlide(); break;
                case 'ArrowUp': restartModule(); break;
                case 'ArrowDown': skipModule(); break;
                case ' ':
                case 'Spacebar':
                    isPaused = !isPaused;
                    resetTimer();
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                    window.open('admin.html', '_blank');
                    break;
                case 'r':
                case 'R':
                    window.open('remote.html', '_blank');
                    break;
                case '0':
                    isLocked = !isLocked;
                    resetTimer();
                    break;
                default:
                    const num = parseInt(event.key);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        slideDuration = num * 10;
                        resetTimer();
                    }
                    break;
            }
        });
        
        resetTimer();
    </script>
</body>
</html>
