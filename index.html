<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Halloween at Coasters Tavern</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Ken Burns Background */
        .bg-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('coasters_halloween.jpg');
            background-size: cover;
            background-position: center;
            animation: ken-burns 40s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes ken-burns {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-1%, -1%); }
        }

        /* Atmospheric Vignette and Darkness */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Subtle Fog/Mist Overlay */
        .fog {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 30%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Lightning Flashes */
        .lightning {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            opacity: 0;
            z-index: 4;
            pointer-events: none;
            animation: lightning-strike 20s infinite;
        }

        @keyframes lightning-strike {
            0%, 91%, 94%, 96%, 100% { opacity: 0; }
            92%, 95% { opacity: 0.15; }
            93% { opacity: 0.3; }
        }

        /* Gentle Ambient Flicker */
        .ambient-flicker {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 5;
            animation: ambient 6s infinite alternate;
            pointer-events: none;
        }

        @keyframes ambient {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        /* Professional Typography Container */
        .content {
            position: absolute;
            bottom: 15%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            animation: elegant-fade 3s ease-out forwards;
        }

        @keyframes elegant-fade {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            letter-spacing: 12px;
            color: #d4af37; /* Elegant gold */
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 130px;
            letter-spacing: 5px;
            color: #f8f9fa;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }

        /* Subtle Cinematic Full Moon */
        .moon {
            position: absolute;
            top: 120px; 
            left: 200px;
            width: 180px; 
            height: 180px;
            background: radial-gradient(circle at 30% 30%, #fffbdd, #d4a000);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 170, 0, 0.4), inset -20px -20px 40px rgba(0,0,0,0.6);
            z-index: 1;
            opacity: 0.9;
        }

        /* Moving Atmospheric Clouds */
        .moving-clouds {
            position: absolute;
            top: 0; 
            left: 0;
            width: 200%; 
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(200, 200, 255, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 20%, rgba(200, 200, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 70%, rgba(150, 150, 200, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(150, 150, 200, 0.05) 0%, transparent 50%);
            background-size: 50% 100%;
            z-index: 2;
            animation: drift 50s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Distant Witch Silhouette */
        .witch {
            position: absolute;
            z-index: 3;
            width: 120px;
            height: 120px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M80,60 L90,65 L85,75 L15,80 L5,70 L10,65 L30,68 L40,40 C35,30 50,10 60,15 C65,20 60,35 50,45 L45,67 Z" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            animation: cinematic-fly 25s linear infinite;
            pointer-events: none;
        }

        @keyframes cinematic-fly {
            0% { transform: translate(-200px, 200px) scale(0.4) rotate(-5deg); opacity: 0; }
            5% { opacity: 0.6; }
            95% { opacity: 0.6; }
            100% { transform: translate(2100px, -50px) scale(0.7) rotate(5deg); opacity: 0; }
        }

        /* Sleek Bats */
        .bats {
            position: absolute;
            width: 60px;
            height: 60px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 40 Q55 20 85 10 Q70 35 95 35 Q75 55 85 75 Q65 60 50 85 Q35 60 15 75 Q25 55 5 35 Q30 35 15 10 Q45 20 50 40 Z" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 4;
            opacity: 0.9;
            animation: swoop-bat linear infinite;
            pointer-events: none;
        }

        .bat1 { top: 25%; left: -100px; animation-duration: 16s; animation-delay: 2s; }
        .bat2 { top: 15%; left: -100px; animation-duration: 22s; animation-delay: 8s; transform: scale(0.8); }
        .bat3 { top: 35%; left: -100px; animation-duration: 19s; animation-delay: 14s; transform: scale(0.6); }

        @keyframes swoop-bat {
            0% { transform: translateX(0) translateY(0) scale(0.5); opacity: 0; }
            5% { opacity: 0.8; }
            25% { transform: translateX(500px) translateY(-50px) scale(0.7); }
            50% { transform: translateX(1000px) translateY(30px) scale(0.9); }
            75% { transform: translateX(1500px) translateY(-30px) scale(1.1); }
            95% { opacity: 0.8; }
            100% { transform: translateX(2100px) translateY(80px) scale(1.3); opacity: 0; }
        }

        /* ... existing code ... */
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="moving-clouds"></div>
    <div class="moon"></div>
    <div class="vignette"></div>
    <div class="fog"></div>
    <div class="ambient-flicker"></div>
    <div class="lightning"></div>
    
    <div class="witch"></div>
    <div class="bats bat1"></div>
    <div class="bats bat2"></div>
    <div class="bats bat3"></div>

    <div class="content">
        <div class="subtitle">Coasters Tavern Presents</div>
        <h1>JOIN US FOR HALLOWEEN</h1>
    </div>

    <script>
        // Keyboard controls
        let isPaused = false;
        let isLocked = false;
        let slideDuration = 10;
        let slideTimer = null;

        function prevSlide() { if(!isLocked) console.log("Previous slide"); }
        function nextSlide() { if(!isLocked) console.log("Next slide"); }
        function restartModule() { if(!isLocked) console.log("Restart module (slide 0)"); }
        function skipModule() { if(!isLocked) console.log("Skip module"); }
        
        function resetTimer() {
            if(slideTimer) clearInterval(slideTimer);
            if(!isPaused && !isLocked) {
                slideTimer = setInterval(nextSlide, slideDuration * 1000);
            }
        }

        document.addEventListener('keydown', function(event) {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (['input', 'textarea', 'select'].includes(activeTag)) return;

            switch(event.key) {
                case 'ArrowLeft': prevSlide(); break;
                case 'ArrowRight': nextSlide(); break;
                case 'ArrowUp': restartModule(); break;
                case 'ArrowDown': skipModule(); break;
                case ' ':
                case 'Spacebar':
                    isPaused = !isPaused;
                    resetTimer();
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                    window.open('admin.html', '_blank');
                    break;
                case 'r':
                case 'R':
                    window.open('remote.html', '_blank');
                    break;
                case '0':
                    isLocked = !isLocked;
                    resetTimer();
                    break;
                default:
                    const num = parseInt(event.key);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        slideDuration = num * 10;
                        resetTimer();
                    }
                    break;
            }
        });
        
        resetTimer();
    </script>
</body>
</html>
